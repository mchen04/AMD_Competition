# Logging configuration consumed by rocm_doctor.logging.configure_logging.
# Loaded via logging.config.dictConfig — anything dictConfig accepts works here.
version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s · %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%SZ"
  compact:
    format: "%(levelname)s %(name)s · %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: compact
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [console]

loggers:
  rocm_doctor:
    level: INFO
    handlers: [console]
    propagate: false
  rocm_doctor.dashboard:
    level: INFO
    propagate: true
  rocm_doctor.providers:
    level: INFO
    propagate: true
