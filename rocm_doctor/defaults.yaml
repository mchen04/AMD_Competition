# Module-level defaults for ROCm Doctor.
#
# config.normalize_config() merges this under the user config at startup.
# Editing a constant here = a one-line YAML change instead of grepping
# providers/* + monitor.py + config.py for hardcoded values.

diagnosis:
  default_provider: rules
  retry:
    max_attempts: 1
    backoff_seconds: 0.0
    retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
    retry_on_timeout: true
    retry_on_invalid_json: true
  templates:
    diagnosis_system: ../templates/openai_diagnosis_system.j2
    repair_system: ../templates/openai_repair_system.j2
  providers:
    openai-responses:
      endpoint: https://api.openai.com/v1/responses
      api_key_env: OPENAI_API_KEY
      model: gpt-5.3-codex
      model_env: ROCM_DOCTOR_OPENAI_MODEL
      timeout_seconds: 30.0
    codex-cli:
      binary: codex
      model_env: ROCM_DOCTOR_CODEX_MODEL
      sandbox: read-only
      timeout_seconds: 90.0
    anthropic-messages:
      endpoint: https://api.anthropic.com/v1/messages
      api_key_env: ANTHROPIC_API_KEY
      api_version: "2023-06-01"
      model: claude-sonnet-4-6
      model_env: ROCM_DOCTOR_ANTHROPIC_MODEL
      timeout_seconds: 30.0
      max_tokens: 1024
    openai-chat-completions:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini
      model_env: ROCM_DOCTOR_OPENAI_COMPATIBLE_MODEL
      timeout_seconds: 30.0
      require_api_key: true
      supports_json_schema: true
      supports_json_object: true

supervision:
  enabled: false
  interval_seconds: 30
  until_pass: false
  cooldown_seconds_after_heal: 60
  cooldown_seconds_after_intent_skip: 300

monitor:
  default_timeout_seconds: 1.5

context:
  default_max_tokens: 2048

model_provider:
  default_request_timeout_seconds: 1.5
  default_stream: false
  default_retry:
    max_attempts: 1
    backoff_seconds: 0.0
    retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
    retry_on_timeout: true
    retry_on_invalid_json: true
  default_validation:
    max_health_response_chars: 120
    max_repeated_token_count: 8
    health_max_tokens: 32
    expected_health_response: ROCM_DOCTOR_OK
    health_response_match: case_insensitive
