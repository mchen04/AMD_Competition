version: 1
workspace: .
reports_dir: reports
state_file: .rocm-doctor-state.json

hardware:
  backend: amd-developer-cloud
  accelerator: mi300x
  runtime: vllm
  deployment_target: digitalocean-gpu-droplet
  amd:
    rocm_required: true
    device_flags: ["/dev/kfd", "/dev/dri"]
    benchmark_profile: mi300x-vllm

launch:
  device_flags: ["/dev/kfd", "/dev/dri"]
  required_device_flags: ["/dev/kfd", "/dev/dri"]
  vllm_args:
    gpu_memory_utilization: 0.9

service:
  name: vllm
  restart_count: 0
  restart_mode: external

self_healing:
  max_attempts: 3
  fallback_model_provider: ""
  developer_repair_mode: false

supervision:
  enabled: true
  interval_seconds: 60
  until_pass: true
  cooldown_seconds_after_heal: 120
  cooldown_seconds_after_intent_skip: 600

active_model_provider: amd-vllm-mi300x
model_providers:
  amd-vllm-mi300x:
    adapter: openai-compatible
    runtime_type: amd-vllm
    endpoint_protocol: openai-compatible
    model:
      id: replace-with-served-model
      endpoint:
        base_url: http://replace-me.example:8000/v1
        expected_base_url: http://replace-me.example:8000/v1
        wrong_base_url: http://replace-me.example:8001/v1
      context:
        max_tokens: 4096
        safe_max_tokens: 8192
      tool_calling:
        enabled: true
        parser: replace-with-parser
        expected_parser: replace-with-parser
        parser_header: X-ROCm-Doctor-Tool-Parser
    capabilities:
      models: true
      chat_completions: true
      tool_calls: true
      context_length: true
      rocm_device_flags: true
      restart: false
    request:
      timeout_seconds: 15.0
      stream: false
      retry:
        max_attempts: 3
        backoff_seconds: 0.5
        retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
        retry_on_timeout: true
        retry_on_invalid_json: true
    templates:
      health_chat: ../templates/health_chat.j2
      health_chat_fallbacks:
        - ../templates/health_chat.qwen_strict.j2
        - ../templates/health_chat.no_reasoning.j2
        - ../templates/health_chat.minimal.j2
      tool_call: ../templates/tool_call_prompt.j2
    health:
      probes:
        - endpoint_models
        - chat_completion
        - context_length
        - rocm_device_flags
        - tool_call_parser
      skip_reasons:
        restart: service restart is controlled outside ROCm Doctor in this template
    repair:
      known_failure_signatures:
        wrong_endpoint_port:
          - GET /v1/models failed
        context_length_too_large:
          - max_model_len exceeds safe_max_model_len
        tool_parser_mismatch:
          - response did not contain a tool call
        missing_rocm_device_flags:
          - missing ROCm device flags
        rocm_oom_inference:
          - HIP out of memory
          - hipErrorOutOfMemory
        max_model_len_mismatch:
          - max_model_len
          - context length of
      safe_recipes:
        - noop
        - retry_without_config_change
        - update_endpoint_url
        - increase_health_max_tokens
        - lower_health_max_tokens
        - increase_timeout
        - increase_retry_backoff
        - disable_streaming
        - switch_prompt_template
        - fallback_model_provider
        - restore_last_known_good_config
        - tighten_expected_health_response
        - disable_tool_probe_for_weak_model
        - lower_max_model_len
        - set_tool_parser
        - set_rocm_device_flags
        - lower_gpu_memory_utilization
        - align_max_tokens_with_served
        - synthesize_patch
    validation:
      max_health_response_chars: 160
      max_repeated_token_count: 8
      health_max_tokens: 32
      expected_health_response: ROCM_DOCTOR_OK
      health_response_match: case_insensitive

diagnosis:
  active_provider: rules
  providers:
    rules:
      type: rules
    fake:
      type: fake
      mode: normal

stress_tests:
  target_model_providers:
    - amd-vllm-mi300x
  timeout_seconds: 15.0
