version: 1
workspace: .
reports_dir: reports
state_file: .rocm-doctor-state.json

hardware:
  backend: local
  accelerator: none
  runtime: fake-openai-compatible
  deployment_target: developer-laptop
  amd:
    rocm_required: false
    device_flags: ["/dev/kfd", "/dev/dri"]
    benchmark_profile: local

launch:
  device_flags: ["/dev/kfd", "/dev/dri"]
  required_device_flags: ["/dev/kfd", "/dev/dri"]

service:
  name: fake-vllm
  restart_count: 0
  restart_mode: dry-run

self_healing:
  max_attempts: 3
  fallback_model_provider: ""
  developer_repair_mode: false

active_model_provider: fake-openai
model_providers:
  fake-openai:
    adapter: openai-compatible
    runtime_type: fake
    endpoint_protocol: openai-compatible
    model:
      id: fake-qwen3
      endpoint:
        base_url: http://127.0.0.1:8000/v1
        expected_base_url: http://127.0.0.1:8000/v1
        wrong_base_url: http://127.0.0.1:8001/v1
      context:
        max_tokens: 2048
        safe_max_tokens: 4096
      tool_calling:
        enabled: true
        parser: qwen3
        expected_parser: qwen3
        parser_header: X-ROCm-Doctor-Tool-Parser
    capabilities:
      models: true
      chat_completions: true
      tool_calls: true
      context_length: true
      rocm_device_flags: true
      restart: true
    request:
      timeout_seconds: 1.5
      stream: false
      retry:
        max_attempts: 2
        backoff_seconds: 0.05
        retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
        retry_on_timeout: true
        retry_on_invalid_json: true
    templates:
      health_chat: ../templates/health_chat.j2
      health_chat_fallbacks:
        - ../templates/health_chat.qwen_strict.j2
        - ../templates/health_chat.no_reasoning.j2
        - ../templates/health_chat.minimal.j2
      tool_call: ../templates/tool_call_prompt.j2
    health:
      probes:
        - endpoint_models
        - chat_completion
        - context_length
        - rocm_device_flags
        - tool_call_parser
      skip_reasons: {}
    repair:
      known_failure_signatures:
        wrong_endpoint_port:
          - GET /v1/models failed
          - configured URL differs from expected URL
        context_length_too_large:
          - max_model_len exceeds safe_max_model_len
        tool_parser_mismatch:
          - response did not contain a tool call
        missing_rocm_device_flags:
          - missing ROCm device flags
      safe_recipes:
        - noop
        - retry_without_config_change
        - update_endpoint_url
        - increase_health_max_tokens
        - lower_health_max_tokens
        - increase_timeout
        - increase_retry_backoff
        - disable_streaming
        - switch_prompt_template
        - fallback_model_provider
        - restore_last_known_good_config
        - tighten_expected_health_response
        - disable_tool_probe_for_weak_model
        - lower_max_model_len
        - set_tool_parser
        - set_rocm_device_flags
        - restart_known_service
        - synthesize_patch
    validation:
      max_health_response_chars: 120
      max_repeated_token_count: 8
      health_max_tokens: 32
      expected_health_response: ROCM_DOCTOR_OK
      health_response_match: case_insensitive

diagnosis:
  active_provider: rules
  providers:
    rules:
      type: rules
    fake:
      type: fake
      mode: normal
    openai-codex:
      type: openai-responses
      endpoint: https://api.openai.com/v1/responses
      api_key_env: OPENAI_API_KEY
      model: gpt-5.3-codex
      model_env: ROCM_DOCTOR_OPENAI_MODEL
      timeout_seconds: 30.0
      retry:
        max_attempts: 1
        backoff_seconds: 0.0
        retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
        retry_on_timeout: true
        retry_on_invalid_json: true
      templates:
        diagnosis_system: ../templates/openai_diagnosis_system.j2
        repair_system: ../templates/openai_repair_system.j2
    anthropic:
      type: anthropic-messages
      endpoint: https://api.anthropic.com/v1/messages
      api_version: "2023-06-01"
      api_key_env: ANTHROPIC_API_KEY
      model: claude-sonnet-4-6
      model_env: ROCM_DOCTOR_ANTHROPIC_MODEL
      timeout_seconds: 30.0
      max_tokens: 1024
      retry:
        max_attempts: 1
        backoff_seconds: 0.0
        retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
        retry_on_timeout: true
        retry_on_invalid_json: true
      templates:
        diagnosis_system: ../templates/openai_diagnosis_system.j2
        repair_system: ../templates/openai_repair_system.j2
    openai-compatible:
      type: openai-chat-completions
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: openai/gpt-4o-mini
      model_env: ROCM_DOCTOR_OPENAI_COMPATIBLE_MODEL
      timeout_seconds: 30.0
      supports_json_schema: true
      supports_json_object: true
      retry:
        max_attempts: 1
        backoff_seconds: 0.0
        retry_status_codes: [408, 409, 429, 500, 502, 503, 504]
        retry_on_timeout: true
        retry_on_invalid_json: true
      templates:
        diagnosis_system: ../templates/openai_diagnosis_system.j2
        repair_system: ../templates/openai_repair_system.j2

stress_tests:
  target_model_providers:
    - fake-openai
  timeout_seconds: 2.0
