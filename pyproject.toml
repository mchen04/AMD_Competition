[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-doctor"
version = "0.1.0"
description = "Local-first self-healing harness for ROCm/vLLM-style AI deployments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rocm-doctor = "rocm_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["rocm_doctor*"]
